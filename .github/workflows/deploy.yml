name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Queued, never cancelled. `cancel-in-progress` killed a run while configure-pages still had a
  # request queued against the Pages API, and the next run's configure-pages saw that stale request
  # as higher priority and cancelled itself in turn, so no deploy ever completed. Waiting for the
  # earlier run to finish costs a few minutes and keeps the Pages requests in order.
  cancel-in-progress: false

jobs:
  build:
    # Pinned rather than ubuntu-latest, which migrates to Ubuntu 26 in October 2026 and leaves
    # this workflow chasing the runner image through two more breaking changes.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
