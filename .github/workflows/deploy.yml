name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # GitHub's own Pages template value. A concurrency group holds one running and one pending run,
  # and a new push replaces whatever is pending — `cancel-in-progress: true` would kill the running
  # deploy as well, so an in-flight Pages deploy is never torn down. Note that pending runs are
  # still superseded by design; only the newest run matters.
  cancel-in-progress: false

jobs:
  build:
    # Pinned rather than ubuntu-latest, which migrates to Ubuntu 26 in October 2026 and leaves
    # this workflow chasing the runner image through two more breaking changes.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      # Vite inlines import.meta.env at build time, so the TURN credential has to reach the build
      # as an environment variable rather than as a file in the repository. It is a repository
      # secret, which keeps it out of git history and out of the built bundle's source map.
      - run: npm run build
        env:
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
